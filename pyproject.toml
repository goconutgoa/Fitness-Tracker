[project]
name = "fitness-nutrition-mcp"
version = "0.1.0"
description = "Remote MCP server for nutrition + full fitness tracking (strength, cardio, steps, body metrics, PRs, trends)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "mcp>=1.2.0",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.30.0",
    "supabase>=2.7.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pytz>=2024.1",
]

[tool.uv]
package = false
